services:
  db:
    image: mariadb
    container_name: chamilo_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: chamilo
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - chamilo_net

  chamilo:
    image: patrickhalasik/chamilo-csrf:1.11.10
    container_name: chamilo_app
    ports:
      - "8081:80"
    volumes:
      - chamilo_data:/var/www/html
    environment:
      - DATABASE_HOST='db'
      - DATABASE_NAME='chamilo'
      - DATABASE_USER='root'
      - DATABASE_PASSWORD='root'

    depends_on:
      - db
    networks:
      - chamilo_net

volumes:
  db_data:
  chamilo_data:

networks:
  chamilo_net: