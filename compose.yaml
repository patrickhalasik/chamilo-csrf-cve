services:
  db:
    image: mariadb
    container_name: chamilo_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: chamilo
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - chamilo_net

  chamilo:
    image: patrickhalasik/chamilo-csrf:1.11.10
    container_name: chamilo_app
    ports:
      - "8081:80"
    volumes:
      - chamilo_data:/var/www/html
    environment:
      - DATABASE_HOST='db'
      - DATABASE_NAME='chamilo'
      - DATABASE_USER='root'
      - DATABASE_PASSWORD='root'
    depends_on:
      - db
    networks:
      - chamilo_net

  malicious-csrf-page:
    image: patrickhalasik/chamilo-malicious-csrf-page:1.11.10
    container_name: chamilo_malicious_csrf_page
    ports:
      - "8082:80"

volumes:
  db_data:
  chamilo_data:

networks:
  chamilo_net:
